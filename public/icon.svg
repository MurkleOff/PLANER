<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#070b14"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- Target circles -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="10 14"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#grad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="50" fill="url(#grad)"/>
  <!-- Flame / Focus crosshair marks -->
  <path d="M256 60 L256 100" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 412 L256 452" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 256 L100 256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <path d="M412 256 L452 256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
</svg>
